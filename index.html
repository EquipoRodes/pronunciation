<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practica tu Pronunciación</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#eff6ff,#e0e7ff);min-height:100vh;padding:16px;color:#1f2937}
  .card{max-width:760px;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.1);padding:28px}
  h1{text-align:center;margin:0 0 4px;font-size:28px}
  .sub{text-align:center;color:#6b7280;margin:0 0 24px}
  .meta{display:flex;justify-content:space-between;font-size:13px;color:#6b7280;font-weight:600;margin-bottom:8px}
  .badge{padding:2px 10px;border-radius:999px;font-size:12px}
  .Fácil{background:#dcfce7;color:#15803d}.Medio{background:#fef9c3;color:#a16207}.Difícil{background:#fee2e2;color:#b91c1c}
  .phrase{background:linear-gradient(90deg,#6366f1,#9333ea);color:#fff;border-radius:14px;padding:24px;text-align:center;margin-bottom:12px}
  .phrase p{font-size:26px;margin:0 0 14px;font-weight:500}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 18px;font-weight:600}
  .listen{background:#fff;color:#4f46e5}
  .tip{background:#eff6ff;border-left:4px solid #60a5fa;padding:12px;border-radius:6px;font-size:14px;margin-bottom:20px}
  .mic{display:block;margin:0 auto;background:#4f46e5;color:#fff;border-radius:999px;padding:16px 32px;font-size:18px}
  .mic.on{background:#ef4444;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .status{text-align:center;font-size:13px;color:#6b7280;margin:10px 0 20px;min-height:18px}
  .heard{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:14px;font-size:20px;margin-bottom:16px}
  .fb{border-left:4px solid;border-radius:10px;padding:16px;margin-bottom:16px}
  .excellent{background:#f0fdf4;border-color:#4ade80}.good{background:#eff6ff;border-color:#60a5fa}
  .fair{background:#fefce8;border-color:#facc15}.needs-work{background:#fff7ed;border-color:#fb923c}
  .error{background:#fef2f2;border-color:#f87171}
  .words{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .w{padding:4px 12px;border-radius:999px;font-size:14px;font-weight:600}
  .ok{background:#bbf7d0;color:#166534}.bad{background:#fecaca;color:#991b1b}
  .actions{display:flex;gap:12px;justify-content:center}
  .secondary{background:#e5e7eb;color:#374151}.primary{background:#4f46e5;color:#fff}
  .hidden{display:none}
  #log{display:none;background:#111827;color:#4ade80;font:11px monospace;border-radius:8px;padding:10px;max-height:110px;overflow:auto;margin-top:20px}
</style>
</head>
<body>
<div class="card">
  <h1>Practica tu Pronunciación</h1>
  <p class="sub">Escucha, repite y recibe retroalimentación instantánea</p>

  <div class="meta"><span id="counter"></span><span id="diff" class="badge"></span></div>
  <div class="phrase">
    <p id="phrase"></p>
    <button class="listen" onclick="playAudio()">🔊 Escuchar pronunciación</button>
  </div>
  <div class="tip">💡 <strong>Consejo:</strong> <span id="tip"></span></div>

  <button id="micBtn" class="mic" onclick="toggleListening()">🎤 Presiona para hablar</button>
  <div class="status" id="status"></div>

  <div id="heardBox" class="hidden">
    <strong>Lo que dijiste:</strong>
    <div class="heard" id="heard"></div>
  </div>
  <div id="feedback" class="hidden"></div>

  <div class="actions">
    <button class="secondary" onclick="resetExercise()">↺ Reintentar</button>
    <button class="primary" onclick="nextPhrase()">Siguiente frase →</button>
  </div>

  <div id="log"></div>
</div>

<script>
const phrases = [
  {text:"The weather is beautiful today", tip:"Enfócate en el sonido 'th' en 'the' y 'weather' - coloca tu lengua entre los dientes", diff:"Fácil"},
  {text:"I would like a cup of coffee", tip:"Practica el sonido de 'would' - es diferente de 'wood'", diff:"Fácil"},
  {text:"She sells seashells by the seashore", tip:"Trabalenguas - practica los sonidos 'sh' y 's' lentamente al principio", diff:"Difícil"},
  {text:"How much does this cost", tip:"El sonido 'th' en 'this' es sonoro - debes sentir vibración en tu garganta", diff:"Medio"},
  {text:"I think it's three thirty", tip:"Múltiples sonidos 'th' - recuerda la posición de la lengua entre los dientes", diff:"Medio"}
];
let current = 0, listening = false, recognition = null;
const $ = id => document.getElementById(id);

function log(msg){
  const el = $('log');
  el.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
  el.scrollTop = el.scrollHeight;
}

function render(){
  const p = phrases[current];
  $('phrase').textContent = `"${p.text}"`;
  $('tip').textContent = p.tip;
  $('counter').textContent = `Frase ${current+1} de ${phrases.length}`;
  $('diff').textContent = p.diff;
  $('diff').className = 'badge ' + p.diff;
  resetExercise();
}

function resetExercise(){
  $('heardBox').classList.add('hidden');
  $('feedback').classList.add('hidden');
  $('status').textContent = '';
}
function nextPhrase(){ current = (current+1) % phrases.length; render(); }

function playAudio(){
  const u = new SpeechSynthesisUtterance(phrases[current].text);
  u.lang = 'en-US'; u.rate = 0.9;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function setListening(on){
  listening = on;
  $('micBtn').classList.toggle('on', on);
  $('micBtn').textContent = on ? '🎤 Escuchando... Habla ahora' : '🎤 Presiona para hablar';
}

function showError(msg){
  const f = $('feedback');
  f.className = 'fb error';
  f.innerHTML = `<strong>⚠️ ${msg}</strong>`;
}

function init(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    log('✗ Speech Recognition no soportado');
    showError('Tu navegador no soporta reconocimiento de voz. Usa Google Chrome o Microsoft Edge.');
    $('micBtn').disabled = true;
    return;
  }
  log('✓ Speech Recognition soportado (' + location.protocol + ')');
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => { setListening(true); $('status').textContent = 'Micrófono activo, habla ahora...'; log('✓ onstart'); };
  recognition.onaudiostart = () => log('✓ Audio capturado');
  recognition.onspeechstart = () => log('✓ Habla detectada');
  recognition.onend = () => { setListening(false); log('onend'); };
  recognition.onresult = e => {
    const text = e.results[0][0].transcript;
    log(`✓ Resultado: "${text}" (${Math.round(e.results[0][0].confidence*100)}%)`);
    $('heard').textContent = `"${text}"`;
    $('heardBox').classList.remove('hidden');
    analyze(text);
  };
  recognition.onerror = e => {
    log('✗ ERROR: ' + e.error);
    setListening(false);
    const msgs = {
      'no-speech':'No se detectó voz. Habla más fuerte o acércate al micrófono.',
      'audio-capture':'No se encontró un micrófono o está siendo usado por otro programa.',
      'not-allowed':'Permiso de micrófono denegado. Haz clic en el ícono del candado junto a la URL y permite el micrófono. Si la página está dentro de un iframe, este debe tener allow="microphone".',
      'network':'Error de red. El reconocimiento de voz necesita internet.',
      'service-not-allowed':'El navegador bloqueó el servicio de voz. Usa HTTPS.'
    };
    showError(msgs[e.error] || ('Error: ' + e.error));
  };
}

function toggleListening(){
  if(!recognition) return;
  if(listening){ recognition.stop(); return; }
  resetExercise();
  try { recognition.start(); log('=== start() ==='); }
  catch(err){ log('✗ ' + err.message); showError('No se pudo iniciar: ' + err.message); }
}

function clean(s){ return s.toLowerCase().replace(/[^a-z' ]/g,'').split(/\s+/).filter(Boolean); }

function analyze(spoken){
  const target = clean(phrases[current].text);
  const said = clean(spoken);
  const pool = [...said];
  const details = target.map((w,i) => {
    const idx = pool.indexOf(w);
    if(idx !== -1){ pool.splice(idx,1); return {w, ok:true}; }
    return {w, ok:false, said: said[i] || '(no detectado)'};
  });
  const hits = details.filter(d => d.ok).length;
  const acc = Math.round(hits / target.length * 100);
  let type, msg;
  if(acc >= 90){ type='excellent'; msg='¡Excelente! Tu pronunciación es muy clara.'; }
  else if(acc >= 70){ type='good'; msg='¡Bien hecho! Algunas palabras necesitan práctica.'; }
  else if(acc >= 50){ type='fair'; msg='Buen intento. Sigue practicando estas palabras.'; }
  else { type='needs-work'; msg='Intenta hablar más despacio y claramente.'; }

  const f = $('feedback');
  f.className = 'fb ' + type;
  f.innerHTML = `<strong>Precisión: ${acc}%</strong><br>${msg}
    <div class="words">${details.map(d =>
      `<span class="w ${d.ok?'ok':'bad'}" title="${d.ok?'':'Entendí: '+d.said}">${d.w} ${d.ok?'✓':'✗'}</span>`).join('')}</div>`;
}

init();
render();
</script>
</body>
</html>
